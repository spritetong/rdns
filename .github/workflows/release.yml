name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 glibc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          # Linux x86_64 musl (static standalone / Alpine)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

          # Linux aarch64 glibc (ARM64 servers / Raspberry Pi)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          # Linux aarch64 musl (static ARM64 / OpenWrt / ImmortalWrt)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup LLVM / clang-cl (Windows ARM64)
        if: runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin") {
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build target (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build target (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          ARCHIVE_NAME="rdns-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/rdns" "${ARCHIVE_NAME}/"
          cp README.md LICENSE config-example.yaml "${ARCHIVE_NAME}/"
          tar -cJf "${ARCHIVE_NAME}.tar.xz" "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $ArchiveName = "rdns-${Tag}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $ArchiveName
          Copy-Item "target/${{ matrix.target }}/release/rdns.exe" -Destination $ArchiveName/
          Copy-Item README.md, LICENSE, config-example.yaml -Destination $ArchiveName/
          tar -cJf "${ArchiveName}.tar.xz" $ArchiveName
          $Hash = (Get-FileHash -Algorithm SHA256 "${ArchiveName}.tar.xz").Hash.ToLower()
          "$Hash  ${ArchiveName}.tar.xz" | Out-File -Encoding ascii "${ArchiveName}.tar.xz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            rdns-*.tar.xz
            rdns-*.tar.xz.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate consolidated checksums
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.xz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
