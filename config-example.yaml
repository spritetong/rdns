global:
  interval: 300 # Global default polling interval (seconds)
  retry_interval: 60 # Fast retry recovery interval when update fails and DNS records mismatch (seconds, default 60)
  timeout: 10 # HTTP request timeout (seconds)
  shutdown_timeout: 10 # Maximum graceful shutdown wait timeout (seconds)
  worker_threads: 2 # Tokio worker threads (set to 1 for ultra-lightweight single-thread; omitted defaults to CPU core count)
  log_level: "info" # trace | debug | info | warn | error | off
  # proxy: "http://127.0.0.1:7890" # Optional global proxy (supports http / socks5)
  # cacerts: "/path/to/custom-ca-bundle.pem" # Optional custom CA certificates file (PEM bundle or DER)

# Generic notification system (optional)
notification:
  on_change:
    enabled: true
    method: "POST"
    url: "https://api.example.com/notify"
    headers:
      Content-Type: "application/json"
    body: |
      {
        "title": "RDNS IP Change Notification",
        "task": "{{task_name}}",
        "old_ip": "{{old_ip}}",
        "new_ip": "{{new_ip}}"
      }
  on_failure:
    enabled: true
    method: "POST"
    url: "https://api.example.com/notify"
    headers:
      Content-Type: "application/json"
    body: |
      {
        "title": "RDNS Update Failure Alert",
        "task": "{{task_name}}",
        "error": "{{error_message}}"
      }

interfaces:
  - name: "Local"
    interval: 300
    retry_interval: 60 # Optional override: fast retry interval when update fails and DNS records mismatch
    dns_server: "8.8.8.8" # Optional DNS server used to check actual remote DNS records (auto-recovers if cloud record is drifted)

    # Unified dual-stack query profile (simultaneously detects both IPv4 and IPv6)
    # Source can be "remote" or "interface"
    ip:
      source: "remote"
      urls:
        - "https://api64.ipify.org"
        - "https://icanhazip.com"
        - "https://ident.me"

    # Optional overrides: ipv4 / ipv6 have higher priority and override ip settings
    # ipv4:
    #   enabled: false       # Disable IPv4 for this interface (IPv6-only)
    # ipv6:
    #   source: "interface"  # Override IPv6 to extract directly from local network adapter
    #   interface: "Local"   # Windows friendly name (e.g. "以太网") or Linux interface (e.g. "eth0")
    #   prefer_slaac: true   # Prioritize stable SLAAC (EUI-64) IPv6 addresses

tasks:
  # Task 1: Dynu adaptive update (auto adapts to dual-stack, IPv4-only, or IPv6-only via conditional patterns)
  - name: "dynu-office-adaptive"
    # interface: "Local"       # Optional; defaults to the first interface if omitted
    domain: "wox-office.freeddns.org" # Checks remote DNS resolution every cycle (optional if username/group is set)
    force_update_interval: 86400 # Heartbeat keepalive interval for this task (seconds)
    provider: "dynu" # Built-in adaptive provider template; query details with `rdns --provider dynu`
    args:
      password: "${DYNU_PASSWORD:-YOUR_UPDATE_PASSWORD}" # Injected as {{password}}
      # username: "your_username" # Optional: account username (required when 'group' is used)
      # group: "office_network"   # Optional: group name to update a collection of hostnames
      # ipv4: null                # Optional: set to null or ~ to disable IPv4 and force IPv6-only for this task

  # Task 2: Standalone webhook with conditional URL replacement ({{?var:THEN|ELSE}})
  - name: "custom-adaptive-webhook"
    interface: "Local"
    domain: "home.example.com"
    force_update_interval: 43200
    args:
      auth_token: "${SECRET_TOKEN:-YOUR_SECRET_TOKEN}"
    request:
      method: "POST"
      url: "https://api.example.com/v1/ddns/update"
      headers:
        Authorization: "Bearer {{auth_token}}"
        Content-Type: "application/json"
      body: |
        {
          "domain": "{{domain}}",
          "ip": "{{ipv6}}"
        }
      success_contains:
        - '"status":"success"'
